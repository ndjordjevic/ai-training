# Curated golangci-lint v2 config for audits (not the CI gate).
# Bug-finding linters only. `--default=all` gave 3,705 mostly-style issues on our first repo,
# and revive + modernize alone gave 768 of 979 issues, all style, so they are left out.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - canonicalheader
    - contextcheck
    - dupl
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gocognit
    - gocritic
    - gosec
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - sloglint
    - testifylint
    - unparam
  settings:
    gocognit:
      min-complexity: 30
    dupl:
      threshold: 150
  exclusions:
    generated: strict # skips files with the "Code generated ... DO NOT EDIT." header
    paths:
      - '.*\.gen\.go$' # backstop for generated files without the header

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
